name: tests

# The suite was run by hand until now, which for a tool whose product IS its
# guarantees is the same class of defect as the ones it exists to catch. Runs on
# every push and PR, on a machine that is by definition not the author's.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap
        # The containment backend. There is no unsandboxed fallback, so without
        # this the suite cannot run at all -- which is the correct behaviour.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Show environment
        run: |
          /usr/bin/python3 --version
          /usr/bin/bwrap --version

      - name: Run the hermetic + adversarial suite
        # No provider binaries are installed here, and none are needed: the
        # suite runs against a committed mock. Live-provider tests skip
        # themselves by discovery rather than by a hardcoded path.
        env:
          # Point the operator-owned files at paths that cannot exist, so a
          # runner's own state can never influence a result.
          SWITCHGEAR_PROVIDERS_FILE: /nonexistent/providers.json
          SWITCHGEAR_VERIFIED_FILE: /nonexistent/verified.json
        run: bash tests/run.sh

  packaging:
    # The hermetic suite runs in-tree, so it cannot see a packaging break. One
    # shipped: package-data globs pointed at directories that no longer existed,
    # and an installed copy had its schemas and nothing else — doctor failed on
    # registry.models and `models` refused. Nothing in CI installed the wheel, so
    # nothing noticed. This job is that missing check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build and install the wheel into a clean venv
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet build
          /tmp/venv/bin/python -m build --wheel --outdir /tmp/dist .
          /tmp/venv/bin/pip install --quiet /tmp/dist/*.whl
      - name: Run it from OUTSIDE the source tree
        # cd away from the repo: resolving data relative to a repo root is
        # exactly the bug this job exists to catch.
        working-directory: /tmp
        run: |
          set -euo pipefail
          /tmp/venv/bin/switchgear --help > /dev/null
          /tmp/venv/bin/switchgear capabilities > /dev/null
          /tmp/venv/bin/switchgear models > /dev/null
          /tmp/venv/bin/switchgear providers > /dev/null
          /tmp/venv/bin/switchgear state provision /tmp/ci-state > /dev/null
          # doctor exits 1 only on a FAIL; warnings are expected on a bare runner
          # with no agent CLIs installed.
          /tmp/venv/bin/switchgear --state /tmp/ci-state doctor

  portability:
    # The suite passing on the author's machine says nothing about the package
    # working anywhere else -- absolute paths under one home directory are
    # exactly how that breaks, and how it broke here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No machine-specific paths in the package or its tests
        run: bash tests/policy/test_no_machine_paths.sh
